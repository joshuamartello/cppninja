<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0f0f0f" stroke="#22c55e" stroke-width="2"/>

  <!-- Ninja head silhouette -->
  <ellipse cx="100" cy="85" rx="45" ry="40" fill="#1a1a1a"/>

  <!-- Ninja mask/bandana -->
  <path d="M55 75 Q100 65 145 75 L145 95 Q100 85 55 95 Z" fill="#22c55e"/>

  <!-- Eyes -->
  <ellipse cx="80" cy="85" rx="12" ry="6" fill="#0f0f0f"/>
  <ellipse cx="120" cy="85" rx="12" ry="6" fill="#0f0f0f"/>

  <!-- Eye shine -->
  <ellipse cx="83" cy="84" rx="4" ry="2" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="123" cy="84" rx="4" ry="2" fill="#ffffff" opacity="0.8"/>

  <!-- C++ angle brackets as ninja collar/scarf -->
  <text x="58" y="145" font-family="monospace" font-size="48" font-weight="bold" fill="#22c55e">&lt;</text>
  <text x="125" y="145" font-family="monospace" font-size="48" font-weight="bold" fill="#22c55e">/&gt;</text>

  <!-- Plus signs (C++) integrated into design -->
  <g fill="#22c55e" opacity="0.6">
    <!-- Left ++ -->
    <rect x="30" y="155" width="12" height="3" rx="1"/>
    <rect x="34" y="151" width="3" height="12" rx="1"/>
    <rect x="42" y="155" width="12" height="3" rx="1"/>
    <rect x="46" y="151" width="3" height="12" rx="1"/>

    <!-- Right ++ -->
    <rect x="146" y="155" width="12" height="3" rx="1"/>
    <rect x="150" y="151" width="3" height="12" rx="1"/>
    <rect x="158" y="155" width="12" height="3" rx="1"/>
    <rect x="162" y="151" width="3" height="12" rx="1"/>
  </g>

  <!-- Shuriken/code star accent -->
  <g transform="translate(100, 178)">
    <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="#22c55e"/>
  </g>
</svg>
